# Publish the product site + public flow gallery (site/) to GitHub Pages.
# Rebuilds the gallery catalogue + thumbnails from site/gallery/data/*.json first,
# so a PR that only adds a flow JSON is enough.
name: Deploy site (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/build-flow-gallery.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/build-flow-gallery.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
